name: portfolio

on:
  push:
    branches: [main]
    paths:
        - "**.html"

  #workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # Required for OIDC token requests


jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.pages_url}}        
            
        steps:
            # checkout code from repository to the runner machine to deploy it to github pages
            - name: checkout code
              uses: actions/checkout@v4

# setup github pages using peaceiris action to deploy the code to github pages
            - name: setup github pages
              uses: actions/configure-pages@v4
# upload the static files to github pages using peaceiris action to deploy the code to github pages
            - name: upload static files to github pages
              uses: actions/upload-pages-artifact@v4
              with:
                path: "."
            

            - name: deploy to github pages
              uses: actions/deploy-pages@v4
            